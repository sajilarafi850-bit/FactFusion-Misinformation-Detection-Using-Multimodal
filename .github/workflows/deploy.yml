name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'README.md'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Create a temporary folder to prepare the flat Hugging Face layout
          mkdir space_dir
          
          # Copy backend files (including Dockerfile and requirements.txt) to the root of the folder
          cp -r backend/* space_dir/
          
          # Copy the root README.md containing the Space metadata frontmatter
          cp README.md space_dir/
          
          # Initialize git in the temporary directory and push
          cd space_dir
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy backend and metadata [skip ci]"
          
          # Force push to the Hugging Face Space repository
          git push --force https://Inas-00:$HF_TOKEN@huggingface.co/spaces/Inas-00/FactFusion-backend main
